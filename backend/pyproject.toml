[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot"
version = "0.1.0"
description = "DevPilot - AI-powered GitHub pull request review platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0.30,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.0,<7.0",
    "structlog>=24.4,<26.0",
    "alembic>=1.13,<2.0",
    # Argon2id is the current password-hashing recommendation; used directly
    # rather than through passlib, which is no longer actively maintained.
    "argon2-cffi>=23.1,<26.0",
    "pyjwt>=2.9,<3.0",
    # Backs Pydantic's EmailStr validation.
    "email-validator>=2.2,<3.0",
    # Supplies the SQLAlchemy `Vector` column type used by code_chunks.
    "pgvector>=0.3,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    # In-memory database for fast schema and repository tests.
    "sqlalchemy[mypy]>=2.0.30,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# --- Ruff: linter + formatter -------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Assertions and long fixture bodies are normal in tests.
"tests/*" = ["S101"]

# --- mypy: static type checking ----------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pgvector ships no type stubs or py.typed marker. Its surface here is a single
# column type, so a targeted exemption is better than loosening strictness.
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Test bodies are exercised by pytest itself; full strictness there adds noise
# without adding safety.
disallow_untyped_defs = false

# --- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires real PostgreSQL and Redis services",
]
