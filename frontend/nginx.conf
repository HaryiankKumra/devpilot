server {
    listen 80;
    server_name _;

    # No version in the Server header. A version string is a lookup key for an
    # attacker and a convenience for nobody else.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # A client-side router owns every other path, so unknown URLs must return
    # index.html rather than 404 -- otherwise a refresh on /reviews/42 breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients keep loading a stale
    # document that references deleted asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
