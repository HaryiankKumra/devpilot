name: CI

# Runs on every push to main and every pull request. A pull request that has
# not been checked is a pull request whose review is guesswork.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run for the previous commit: the old result is about
# code nobody will merge, and leaving it queued wastes a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVPILOT_ENVIRONMENT: ci
  # Deliberately no DEVPILOT_SECRET_KEY here. Nothing in CI needs one -- the
  # tests build their own Settings, and only `production` demands a real
  # secret -- and setting it at workflow level made it visible to every test
  # process, which broke the two tests that assert on the *default* key. The
  # suite is now hermetic (see tests/conftest.py), so this would no longer
  # break anything; it is still absent because an unused secret in a workflow
  # file is only ever a liability.

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      # The same pgvector image Compose uses. Testing against stock Postgres
      # would skip every retrieval test, which is where the interesting SQL is.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devpilot
          POSTGRES_PASSWORD: devpilot
          POSTGRES_DB: devpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Format
        working-directory: backend
        run: ruff format --check .

      - name: Type check
        working-directory: backend
        run: mypy app tests

      - name: Migrate
        working-directory: backend
        env:
          DEVPILOT_DATABASE_URL: postgresql+psycopg://devpilot:devpilot@localhost:5432/devpilot
        # Running migrations rather than creating tables from metadata is the
        # point: this is the only place the migrations are executed against a
        # real database before a deploy does it.
        run: alembic upgrade head

      - name: Test
        working-directory: backend
        env:
          DEVPILOT_DATABASE_URL: postgresql+psycopg://devpilot:devpilot@localhost:5432/devpilot
          DEVPILOT_REDIS_URL: redis://localhost:6379/0
          DEVPILOT_TEST_DATABASE_URL: postgresql+psycopg://devpilot:devpilot@localhost:5432/devpilot
        # Integration tests included: CI is where they are meant to run, since
        # the services are here.
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly the lockfile. `npm install` may silently
      # resolve a different tree, which is how a build passes in CI and fails
      # for everyone else.
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format
        working-directory: frontend
        run: npm run format:check

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # Only worth running once the parts pass on their own; a browser failure
    # caused by a type error is a slow way to learn about a type error.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          # Wait for the API rather than sleeping: a fixed sleep is either too
          # short on a slow runner or wasted time on a fast one.
          timeout 180 bash -c 'until curl -sf http://localhost:8000/health >/dev/null; do sleep 2; done'
          docker compose exec -T api alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The config's CI reporter is `github`, which annotates the diff but
      # writes no file. Adding `html` as well is what makes the failure artifact
      # below contain anything worth downloading.
      - name: Run browser tests
        working-directory: frontend
        run: npx playwright test --reporter=github,html

      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose-logs.txt
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the production Dockerfiles still work,
      # which the Compose dev images do not — they use a different target.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the production frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
